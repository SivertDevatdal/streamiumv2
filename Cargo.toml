[workspace]
resolver = "2"
members = [
    "crates/streamium-core",
    "crates/streamium-mpegts",
    "crates/streamium-ffi",
    "crates/streamium-probe",
    "crates/uniffi-bindgen",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "UNLICENSED"
repository = "https://github.com/sivertdevatdal/streamiumv2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
quick-xml = "0.42"
flate2 = "1.1"
url = "2.5"
uniffi = "0.32"

# Release builds are what ship inside the app bundles. Optimise for speed,
# strip symbols, and abort on panic so a bug in the core can never unwind
# across the FFI boundary into Swift/Kotlin.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
debug = false

[profile.dev]
opt-level = 1
