name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Install ffmpeg (test fixtures) and the libraries the desktop shell links against
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Generate test streams
        run: ./scripts/make-test-streams.sh
      - name: Test
        run: cargo test --workspace
      - name: Verify the demuxed elementary streams decode
        run: ./scripts/verify-demuxer.sh
      - name: Bindings generate (Swift + Kotlin)
        run: |
          cargo build -p streamium-ffi
          cargo run -q -p uniffi-bindgen -- generate --library target/debug/libstreamium.so --language swift --out-dir out/swift
          cargo run -q -p uniffi-bindgen -- generate --library target/debug/libstreamium.so --language kotlin --out-dir out/kotlin
          ls -la out/swift out/kotlin/app/streamium/core

  apple:
    name: Apple (macOS + iOS Simulator)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Build XCFramework and bindings
        env:
          PROFILE: debug
          SKIP_TARGETS: x86_64-apple-ios x86_64-apple-darwin
        run: ./apple/scripts/build-xcframework.sh
      - name: Install ffmpeg and generate test streams
        run: brew install ffmpeg && ./scripts/make-test-streams.sh
      - name: Swift package tests (macOS)
        working-directory: apple/StreamiumKit
        run: swift test
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd apple && xcodegen generate
      - name: Build macOS app
        working-directory: apple
        run: |
          xcodebuild -project Streamium.xcodeproj -scheme Streamium-macOS -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build | xcpretty && exit ${PIPESTATUS[0]}
      - name: Build iOS app (simulator)
        working-directory: apple
        run: |
          xcodebuild -project Streamium.xcodeproj -scheme Streamium-iOS \
            -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | xcpretty && exit ${PIPESTATUS[0]}

  windows:
    name: Windows desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy -p streamium-desktop --all-targets -- -D warnings
      - name: Test
        run: cargo test -p streamium-desktop
      - name: Build
        run: cargo build -p streamium-desktop --release
      - name: Stage the download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item target/release/streamium.exe dist/streamium.exe
          Copy-Item docs/WINDOWS.md dist/README.md
          Copy-Item docs/COMPLIANCE.md dist/COMPLIANCE.md
      - name: Upload the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: streamium-windows-x86_64
          path: dist/
          retention-days: 90
