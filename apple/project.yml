# XcodeGen specification. `xcodegen generate` produces Streamium.xcodeproj.
#
# Run apple/scripts/bootstrap-mac.sh instead of calling this directly: the
# Swift package depends on StreamiumCoreFFI.xcframework, which must exist
# before the project can resolve.
name: Streamium

options:
  bundleIdPrefix: app.streamium
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: Streamium
    # Local development signs to run on this machine; no team required for
    # macOS or the iOS Simulator.
    CODE_SIGN_STYLE: Automatic

packages:
  StreamiumKit:
    path: StreamiumKit

targets:
  Streamium-macOS:
    type: application
    platform: macOS
    sources:
      - path: Streamium
        excludes:
          - "Resources/**"
    dependencies:
      - package: StreamiumKit
        product: StreamiumKit
      - package: StreamiumKit
        product: StreamiumCore
    entitlements:
      path: Streamium/Resources/Streamium.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.streamium.macos
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
    info:
      path: Streamium/Resources/Info-macOS.plist
      properties:
        CFBundleDisplayName: Streamium
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        # Media servers, tuners and many IPTV providers are reachable only
        # over plain HTTP. Justify this in the App Review notes.
        #
        # Only NSAllowsArbitraryLoads. Apple ignores it whenever
        # NSAllowsArbitraryLoadsForMedia, NSAllowsArbitraryLoadsInWebContent
        # or NSAllowsLocalNetworking is also present, which would leave plain
        # HTTP exempt for media but blocked for the provider's own API.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Streamium connects to media servers and TV tuners on your local network.

  Streamium-iOS:
    type: application
    platform: iOS
    sources:
      - path: Streamium
        excludes:
          - "Resources/**"
    dependencies:
      - package: StreamiumKit
        product: StreamiumKit
      - package: StreamiumKit
        product: StreamiumCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.streamium.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    info:
      path: Streamium/Resources/Info-iOS.plist
      properties:
        CFBundleDisplayName: Streamium
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UIRequiresFullScreen: false
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Only NSAllowsArbitraryLoads. Apple ignores it whenever
        # NSAllowsArbitraryLoadsForMedia, NSAllowsArbitraryLoadsInWebContent
        # or NSAllowsLocalNetworking is also present, which would leave plain
        # HTTP exempt for media but blocked for the provider's own API.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Streamium connects to media servers and TV tuners on your local network.

schemes:
  Streamium-macOS:
    build:
      targets: { Streamium-macOS: all }
    run:
      config: Debug
  Streamium-iOS:
    build:
      targets: { Streamium-iOS: all }
    run:
      config: Debug
