# XcodeGen specification. `xcodegen generate` produces Streamium.xcodeproj.
name: Streamium
options:
  bundleIdPrefix: app.streamium
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  StreamiumKit:
    path: StreamiumKit

targetTemplates:
  App:
    type: application
    sources:
      - path: Streamium
        excludes:
          - "Resources/**"
    dependencies:
      - package: StreamiumKit
        product: StreamiumKit
      - package: StreamiumKit
        product: StreamiumCore
    entitlements:
      path: Streamium/Resources/Streamium.entitlements
    info:
      path: Streamium/Resources/Info-${platform}.plist
      properties:
        CFBundleDisplayName: Streamium
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Users connect to media servers and tuners on their own networks,
        # which commonly speak plain HTTP. Justify this in App Review notes.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsArbitraryLoadsForMedia: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Streamium connects to media servers and TV tuners on your local network.

targets:
  Streamium-iOS:
    templates: [App]
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.streamium.ios
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    info:
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [audio]
        UIRequiresFullScreen: false
        LSSupportsOpeningDocumentsInPlace: true
        UISupportsDocumentBrowser: true

  Streamium-macOS:
    templates: [App]
    platform: macOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.streamium.macos
    info:
      properties:
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ""

schemes:
  Streamium-iOS:
    build:
      targets: { Streamium-iOS: all }
    run:
      config: Debug
  Streamium-macOS:
    build:
      targets: { Streamium-macOS: all }
    run:
      config: Debug
